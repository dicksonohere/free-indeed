function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function nf(n){
  var neg = n < 0; n = Math.abs(n);
  var s = (Math.round(n*100)/100).toLocaleString("en-US",{maximumFractionDigits:2});
  return (neg?"-":"") + CUR + s;

function nf0(n){
  var neg = n < 0; n = Math.abs(n);
  var s = Math.round(n).toLocaleString("en-US");

function pad2(n){ return n<10 ? "0"+n : ""+n; }
function isoOf(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function fromISO(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- cycles ---------- */
var PER_DAY  = { daily:1, weekly:1/7, monthly:1/30.4375, yearly:1/365.25 };
var UNIT_DAYS = { day:1, week:7, month:30.4375, year:365.25 };
var UNIT_WORD = { day:"a day", week:"a week", month:"a month", year:"a year" };
var CYCLE_WORD = { daily:"daily", weekly:"weekly", monthly:"monthly", yearly:"yearly" };
function perUnit(amount, cycle, unit){
  return (+amount || 0) * (PER_DAY[cycle]||PER_DAY.monthly) * (UNIT_DAYS[unit]||UNIT_DAYS.month);
}

/* ============================================================
   THE LOCK — real encryption, on the device, with nothing sent anywhere.
   A random data key holds the app. That key is wrapped twice:
   once by the PIN, once by the recovery key. Lose both and it is gone.
   ============================================================ */
var TE = new TextEncoder(), TD = new TextDecoder();
function rnd(n){ var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
function b64(u8){ var s=""; for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]); return btoa(s); }
function unb64(s){ var r=atob(s), a=new Uint8Array(r.length); for(var i=0;i<r.length;i++) a[i]=r.charCodeAt(i); return a; }

var B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function toKey(u8){
  var bits=0, val=0, out="";
  for(var i=0;i<u8.length;i++){
    val = (val<<8) | u8[i]; bits += 8;
    while(bits >= 5){ out += B32[(val >>> (bits-5)) & 31]; bits -= 5; }
  }
  if(bits>0) out += B32[(val << (5-bits)) & 31];
  var g=[]; for(var j=0;j<out.length;j+=4) g.push(out.slice(j,j+4));
  return g.join("-");
}
function normKey(s){
  return String(s).toUpperCase().replace(/[^0-9A-Z]/g,"")
    .replace(/O/g,"0").replace(/[IL]/g,"1").replace(/U/g,"V");
}
async function kek(secret, salt){
  var base = await crypto.subtle.importKey("raw", TE.encode(secret), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:salt, iterations:KDF_ITER, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
async function newDek(){
  return crypto.subtle.generateKey({name:"AES-GCM",length:256}, true, ["encrypt","decrypt"]);
}
async function wrapDek(dek, secret){
  var salt = rnd(16), iv = rnd(12);
  var raw = new Uint8Array(await crypto.subtle.exportKey("raw", dek));
  var ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv}, await kek(secret,salt), raw));
  return { salt:b64(salt), iv:b64(iv), ct:b64(ct) };
}
async function unwrapDek(w, secret){
  var raw = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv:unb64(w.iv)}, await kek(secret, unb64(w.salt)), unb64(w.ct));
  return crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, true, ["encrypt","decrypt"]);

async function seal(dek, obj){
  var iv = rnd(12);

    {name:"AES-GCM",iv:iv}, dek, TE.encode(JSON.stringify(obj))));

  var p = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(d.iv)}, dek, unb64(d.ct));

function vault(){

function putVault(v){ localStorage.setItem(VKEY, JSON.stringify(v)); }

var saving = false, again = false;
async function save(){
  if(!DEK || !S) return;
  if(saving){ again = true; return; }
  saving = true;
  try{
    var v = vault(); if(!v) return;
    v.data = await seal(DEK, S);
    v.built = APP_VERSION;
    putVault(v);
  } catch(e){ console.error("save failed", e); }
  saving = false;
  if(again){ again = false; await save(); }
}

/* ---------- estimates carry their own dated changes, so a line can move
     over time and the past is never rewritten ---------- */
function mkItem(name, amount, cycle, tier){
  return { id:uid(), name:name, tier:tier||null,
           changes:[{ date:todayISO(), amount:+amount||0, cycle:cycle||"monthly" }] };
}
function cur(it){ return it.changes[it.changes.length-1]; }
function setItem(it, amount, cycle){
  var c = cur(it), t = todayISO();
  if(c.date === t){ c.amount = +amount||0; c.cycle = cycle; }
  else it.changes.push({ date:t, amount:+amount||0, cycle:cycle });
}
function valueAt(it, iso){
  var pick = null;
  for(var i=0;i<it.changes.length;i++){
    if(it.changes[i].date <= iso) pick = it.changes[i]; else break;
  }
  return pick;
}
function sumAt(list, iso, unit){
  var t = 0;
  for(var i=0;i<list.length;i++){
    var c = valueAt(list[i], iso);
    if(c) t += perUnit(c.amount, c.cycle, unit);
  }
  return t;
}
function sumNow(list, unit){ return sumAt(list, todayISO(), unit); }
/* nothing set out yet at that date reads as nothing known, never as zero */
function sumAtOrNull(list, iso, unit){
  var t = 0, any = false;
  for(var i=0;i<list.length;i++){
    var c = valueAt(list[i], iso);
    if(c){ any = true; t += perUnit(c.amount, c.cycle, unit); }
  }
  return any ? t : null;
}
function hasEstimates(){

function dailyVerse(){

    seed = (seed * 7919 + 104729) % 100003;
    S.verse = { date:t, i: seed % VERSES.length };
    save();
  }
  return VERSES[S.verse.i % VERSES.length];
}

function canShareFiles(){
  try{
    if(!navigator.share || !navigator.canShare) return false;
    return navigator.canShare({ files:[ new File(["x"],"x.txt",{type:"text/plain"}) ] });
  }catch(e){ return false; }
}
async function handOut(name, text, mime){
  var f = new File([text], name, { type: mime || "text/plain" });
  if(canShareFiles()){
    try{ await navigator.share({ files:[f], title:name }); return "shared"; }
    catch(e){ if(e && (e.name==="AbortError"||e.name==="NotAllowedError")) return "cancelled"; }
  }
  try{
    var url = URL.createObjectURL(f);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    return "saved";
  }catch(e){ return "failed"; }
}

/* ---------- restore a backup file at the gate ---------- */
function readBackupFile(file){
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    var v;
    try{ v = JSON.parse(String(fr.result)); }catch(e){ v = null; }
    if(!v || v.app !== "Free Indeed" || !v.pin || !v.rec){
      var e1 = $("perr") || $("mrestoreerr");
      if(e1) e1.textContent = "That is not a Free Indeed backup file.";
      return;
    }
    putVault(v);
    gateUnlock();
  };
  fr.readAsText(file);
}

/* ============================================================
   THE PICTURE — a compact line graph above, bars beneath,
   one timeframe control governing both. Solid lines only.
   Active income is never drawn here.
   ============================================================ */
function shortMoney(n){
  var a = Math.abs(n);
  if(a >= 1e9) return CUR + (Math.round(n/1e8)/10) + "b";
  if(a >= 1e6) return CUR + (Math.round(n/1e5)/10) + "m";
  if(a >= 1e3) return CUR + (Math.round(n/100)/10) + "k";
  return CUR + Math.round(n);
}
function slices(unit){
  var out = [], i, d = new Date(); d.setHours(0,0,0,0);
  if(unit === "day"){
    for(i=13;i>=0;i--){ var a=new Date(d); a.setDate(d.getDate()-i);
      out.push({ s:isoOf(a), e:isoOf(a), lab:String(a.getDate()) }); }
  } else if(unit === "week"){
    var mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay()+6)%7));
    for(i=11;i>=0;i--){ var w=new Date(mon); w.setDate(mon.getDate()-i*7);
      var we=new Date(w); we.setDate(w.getDate()+6);
      out.push({ s:isoOf(w), e:isoOf(we), lab:w.getDate()+" "+MON[w.getMonth()] }); }
  } else if(unit === "month"){
    for(i=11;i>=0;i--){
      var m1 = new Date(d.getFullYear(), d.getMonth()-i, 1);
      var m2 = new Date(d.getFullYear(), d.getMonth()-i+1, 0);
      out.push({ s:isoOf(m1), e:isoOf(m2), lab:MON[m1.getMonth()] });
    }
  } else {
    for(i=4;i>=0;i--){ var y = d.getFullYear()-i;
      out.push({ s:y+"-01-01", e:y+"-12-31", lab:String(y) }); }
  }
  return out;
}
function clampToday(iso){ var t = todayISO(); return iso > t ? t : iso; }

function outInSlice(sl){
  var t = 0;
  for(var i=0;i<S.entries.length;i++){
    var x = S.entries[i];
    if(x.dir !== "out" || x.giving || x.unreadable || !x.date) continue;
    if(x.date >= sl.s && x.date <= sl.e) t += (+x.amount || 0);
  }
  return t;
}

function svgLines(sl, A, B){
  var W = 320, H = 128, L = 40, R = 8, T = 12, Bm = 20, i;
  var all = A.concat(B), max = 0;
  for(i=0;i<all.length;i++) if(all[i] !== null && all[i] > max) max = all[i];
  if(max <= 0) max = 1;
  max = max * 1.18;
  var iw = W - L - R, ih = H - T - Bm;
  var n = sl.length;
  function X(k){ return n <= 1 ? L + iw/2 : L + (iw * k / (n-1)); }
  function Y(v){ return T + ih - (ih * (v / max)); }
  /* a period with nothing set out is a gap in the line, never a zero */
  function poly(arr){
    var p = [];
    for(var k=0;k<arr.length;k++) if(arr[k] !== null) p.push(X(k).toFixed(1)+","+Y(arr[k]).toFixed(1));
    return p.join(" ");
  }
  function lastOf(arr){ for(var k=arr.length-1;k>=0;k--) if(arr[k] !== null) return k; return -1; }
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Passive income and living costs over time">';
  s += '<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="#cfccc4" stroke-width="1"/>';
  s += '<line x1="'+L+'" y1="'+T+'" x2="'+(W-R)+'" y2="'+T+'" stroke="#eceae4" stroke-width="1"/>';
  s += '<line x1="'+L+'" y1="'+(T+ih/2)+'" x2="'+(W-R)+'" y2="'+(T+ih/2)+'" stroke="#eceae4" stroke-width="1"/>';
  s += '<text x="'+(L-4)+'" y="'+(T+4)+'" text-anchor="end" font-size="8" fill="#8b9096">'+esc(shortMoney(max))+'</text>';
  s += '<text x="'+(L-4)+'" y="'+(T+ih)+'" text-anchor="end" font-size="8" fill="#8b9096">0</text>';
  s += '<polyline fill="none" stroke="#a82318" stroke-width="2" stroke-linejoin="round" points="'+poly(B)+'"/>';
  s += '<polyline fill="none" stroke="#0a6f38" stroke-width="2" stroke-linejoin="round" points="'+poly(A)+'"/>';
  var lb = lastOf(B), la = lastOf(A);
  if(lb >= 0) s += '<circle cx="'+X(lb).toFixed(1)+'" cy="'+Y(B[lb]).toFixed(1)+'" r="2.8" fill="#a82318"/>';
  if(la >= 0) s += '<circle cx="'+X(la).toFixed(1)+'" cy="'+Y(A[la]).toFixed(1)+'" r="2.8" fill="#0a6f38"/>';
  s += '<text x="'+L+'" y="'+(H-6)+'" font-size="8" fill="#8b9096">'+esc(sl[0].lab)+'</text>';
  s += '<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="8" fill="#8b9096">'+esc(sl[n-1].lab)+'</text>';
  s += '</svg>';
  return s;
}

function svgBars(sl, vals, marks){
  var W = 320, H = 132, L = 40, R = 8, T = 10, Bm = 22;
  var max = 0, i;
  for(i=0;i<vals.length;i++) if(vals[i] > max) max = vals[i];
  for(i=0;i<marks.length;i++) if(marks[i] !== null && marks[i] > max) max = marks[i];
  if(max <= 0) max = 1;
  max = max * 1.18;
  var iw = W - L - R, ih = H - T - Bm, n = sl.length;
  var step = iw / n, bw = Math.max(4, step * 0.62);
  function Y(v){ return T + ih - (ih * (v/max)); }
  var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Money out recorded, with your estimate marked on each bar">';
  s += '<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="#cfccc4" stroke-width="1"/>';
  s += '<text x="'+(L-4)+'" y="'+(T+4)+'" text-anchor="end" font-size="8" fill="#8b9096">'+esc(shortMoney(max))+'</text>';
  for(i=0;i<n;i++){
    var cx = L + step*i + step/2, x = cx - bw/2;
    var y = Y(vals[i]), h = Math.max(0, (T+ih) - y);
    s += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="#a82318" opacity="0.85" rx="1"/>';
    if(marks[i] !== null && marks[i] > 0){
      var my = Y(marks[i]);
      s += '<line x1="'+(x-2).toFixed(1)+'" y1="'+my.toFixed(1)+'" x2="'+(x+bw+2).toFixed(1)+'" y2="'+my.toFixed(1)+'" stroke="#17181a" stroke-width="1.6"/>';
    }
    if(n <= 14 || i === 0 || i === n-1)
      s += '<text x="'+cx.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="7.5" fill="#8b9096">'+esc(sl[i].lab)+'</text>';
  }
  s += '</svg>';
  return s;
}

function undatedCount(){

function scGap(){

  if(!hasEstimates()){
    s += '<div class="card"><p style="margin-top:0">No estimates are set out yet, so there is no gap to read.</p>'+

         '<button class="btn wide" data-a="tab" data-v="setup" style="margin-top:10px">Set out my estimates</button></div>';
    return s;
  }

  var pas = sumNow(S.passive, u);
  var basic = 0, above = 0;
  for(var i=0;i<S.costs.length;i++){
    var c = valueAt(S.costs[i], todayISO());

    if(S.costs[i].tier === "above") above += perUnit(c.amount, c.cycle, u);
    else basic += perUnit(c.amount, c.cycle, u);
  }
  var costs = basic + above;
  var free = pas >= costs && costs > 0;

  s += '<div class="card">';
  s += '<div class="kv"><div class="k">Passive income<small>estimate</small></div>'+
       '<div class="v in">'+esc(nf0(pas))+' '+esc(w)+'</div></div>';
  s += '<div class="kv"><div class="k">Living costs — basic needs<small>estimate</small></div>'+
       '<div class="v out">'+esc(nf0(basic))+' '+esc(w)+'</div></div>';
  s += '<div class="kv"><div class="k">Living costs — above basic<small>estimate</small></div>'+

function numFrom(t){
  var c = String(t).replace(/[^\d.,\-]/g,"").replace(/,/g,"");
  if(!/\d/.test(c)) return null;
  var n = parseFloat(c);
  return isNaN(n) ? null : Math.abs(n);
}
function looksDate(t){
  t = String(t).trim();
  if(/^\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(t)) return true;
  if(/^\d{1,2}[-/.]\d{1,2}([-/.]\d{2,4})?$/.test(t)) return true;
  if(/^\d{1,2}\s+[A-Za-z]{3,}\.?,?\s*\d{0,4}$/.test(t)) return true;
  if(/^[A-Za-z]{3,}\.?\s+\d{1,2},?\s*\d{0,4}$/.test(t)) return true;
  return false;
}
function monthNum(w){
  w = String(w).toLowerCase().slice(0,3);
  var m = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  var i = m.indexOf(w); return i < 0 ? null : i+1;
}
function parseDate(t, dayFirst){
  t = String(t).trim(); if(!t) return null;
  var m, y, mo, d, now = new Date();
  if((m = t.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m = t.match(/^(\d{1,2})[-/.](\d{1,2})(?:[-/.](\d{2,4}))?/))){
    var a=+m[1], b=+m[2];
    y = m[3] ? +m[3] : now.getFullYear();
    if(y < 100) y += 2000;
    if(a > 12){ d=a; mo=b; }
    else if(b > 12){ d=b; mo=a; }
    else if(dayFirst){ d=a; mo=b; }
    else { mo=a; d=b; }
  }
  else if((m = t.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?,?\s*(\d{2,4})?/))){
    d=+m[1]; mo=monthNum(m[2]); y = m[3] ? +m[3] : now.getFullYear(); if(y<100) y+=2000;
  }
  else if((m = t.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s*(\d{2,4})?/))){
    mo=monthNum(m[1]); d=+m[2]; y = m[3] ? +m[3] : now.getFullYear(); if(y<100) y+=2000;
  }
  else return null;
  if(!mo || !d || mo<1 || mo>12 || d<1 || d>31) return null;
  return y+"-"+pad2(mo)+"-"+pad2(d);
}
function dirFrom(t){
  var s = String(t).toLowerCase().replace(/[^a-z]/g,"");
  if(s === "moneyin" || s === "in" || s === "credit" || s === "cr" || s === "income" || s === "inflow") return "in";
  if(s === "moneyout" || s === "out" || s === "debit" || s === "dr" || s === "expense" || s === "outflow") return "out";
  return null;
}
function splitRow(line){
  if(line.indexOf("\t") >= 0) return line.split("\t");
  var p = line.split(/\s{2,}/);
  if(p.length >= 3) return p;
  p = line.split(/\s*[|;]\s*/);
  if(p.length >= 3) return p;
  return line.split(/\s*,\s*/);
}

function doPaste(){
  var raw = $("pBox").value || "";
  var lines = raw.split(/\r?\n/), rows = [], i, j;
  for(i=0;i<lines.length;i++){ if(lines[i].trim()) rows.push(lines[i]); }
  if(!rows.length){ $("pErr").textContent = "Nothing pasted."; return; }

  /* which way round are the ambiguous dates? Take it from the lines that cannot be mistaken. */
  var dayFirst = true, dfVotes = 0, mfVotes = 0;
  for(i=0;i<rows.length;i++){
    var cs = splitRow(rows[i]);
    for(j=0;j<cs.length;j++){
      var mm = String(cs[j]).trim().match(/^(\d{1,2})[-/.](\d{1,2})(?:[-/.]\d{2,4})?$/);
      if(mm){ if(+mm[1] > 12) dfVotes++; else if(+mm[2] > 12) mfVotes++; }
    }
  }
  if(mfVotes > dfVotes) dayFirst = false;

  var n = 0, added = 0;
  for(i=0;i<rows.length;i++){
    var line = rows[i], cells = splitRow(line), k;
    for(k=0;k<cells.length;k++) cells[k] = String(cells[k]).trim();

    /* a header row is one whose cells are column names, exactly */
    var hits = 0;
    for(k=0;k<cells.length;k++){
      var h = cells[k].toLowerCase().replace(/[^a-z ]/g,"").trim();
      if(h==="timestamp"||h==="date"||h==="direction"||h==="amount"||h==="for what"||
         h==="what"||h==="description"||h==="narration"||h==="details"||h==="memo") hits++;
    }
    if(hits >= 2) continue;

    var dirIdx = -1, dir = null;
    for(k=0;k<cells.length;k++){ var d0 = dirFrom(cells[k]); if(d0){ dirIdx = k; dir = d0; break; } }

    var date = null, amount = null, what = "";
    if(dirIdx >= 0){
      /* DATE is the last readable date before the direction — the timestamp comes first and is ignored */
      for(k=dirIdx-1;k>=0;k--){ if(looksDate(cells[k])){ date = parseDate(cells[k], dayFirst); if(date) break; } }
      for(k=dirIdx+1;k<cells.length;k++){ var a0 = numFrom(cells[k]); if(a0 !== null){ amount = a0; break; } }
      var rest = [];
      var seen = false;
      for(k=dirIdx+1;k<cells.length;k++){
        if(!seen && numFrom(cells[k]) !== null){ seen = true; continue; }
        if(seen && cells[k]) rest.push(cells[k]);
      }
      what = rest.join(" ").trim();
    }

    n++;
    if(dir && amount !== null){
      S.entries.push({ id:uid(), n:Date.now()+n, date:date, dir:dir, amount:amount,
                       what:what, giving:false, unreadable:false, raw:line, pasted:true });
      added++;
    } else {
      S.entries.push({ id:uid(), n:Date.now()+n, date:date, dir:"out", amount:0,
                       what:"", giving:false, unreadable:true, raw:line, pasted:true });
    }
  }
  save();
  go("ledger");
}

/* ============================================================
   THE CUPBOARD — rooms he names himself. Two baskets. One tap to take.
   When the in-use one runs out, the reserve is drawn on and a refill
   lands on the pending list. Nothing nags for completeness.
   ============================================================ */
function roomOf(id){ for(var i=0;i<S.rooms.length;i++) if(S.rooms[i].id===id) return S.rooms[i]; return null; }
function itemOf(room, id){ for(var i=0;i<room.items.length;i++) if(room.items[i].id===id) return room.items[i]; return null; }
function isPending(itemId){ for(var i=0;i<S.pending.length;i++) if(S.pending[i].itemId===itemId) return true; return false; }
function addPending(room, item){
  if(isPending(item.id)) return;      /* no carry, no doubling */
  S.pending.push({ id:uid(), itemId:item.id, roomId:room.id,
                   name:item.name, room:room.name, date:todayISO() });
}
function pullReserve(room, item){
  if(item.reserve > 0){ item.reserve -= 1; item.inUse += 1; }
  addPending(room, item);
}
function takeItem(roomId, itemId){
  var r = roomOf(roomId); if(!r) return;
  var it = itemOf(r, itemId); if(!it) return;
  if(it.inUse <= 0){ pullReserve(r, it); if(it.inUse <= 0){ save(); paint(); return; } }
  it.inUse -= 1;
  it.takes.push(todayISO());
  if(it.takes.length > 60) it.takes = it.takes.slice(-60);
  if(it.inUse <= 0) pullReserve(r, it);
  save(); paint();
}

  }
  s += '<p class="note">A refill you cannot afford stays here. No carry, no doubling, nothing counted against you.</p>';
  s += '</div>';

}

       '<button class="btn sec wide" data-a="tab" data-v="setup" style="margin-bottom:8px">Estimates</button>'+
       '<button class="btn sec wide" data-a="tab" data-v="welcome" style="margin-bottom:8px">The welcome · vision · legacy</button>'+
       '<button class="btn sec wide" data-a="tab" data-v="paste">Paste box</button></div>';

  s += '<h3>Talking with GOD</h3>';
  s += '<div class="card">'+
       '<button class="sw" data-a="faith" aria-pressed="'+(!!S.faith)+'" style="background:none;border:0;padding:0;width:100%">'+
         '<span class="box"><b></b></span>'+
         '<span style="text-align:left;font-weight:600">'+(S.faith?"On":"Set aside")+'</span>'+
       '</button>'+
       '<p class="note">This governs the daily verse, the letters, and the threads. '+
       'The verse at the bottom of the app is always there.</p></div>';

  s += '<h3>Backup</h3>';
  s += '<div class="card">'+
       '<p class="note" style="margin-top:0">One file, locked with your own word or phrase. '+
       'It holds everything and it is what moves your record to another phone.</p>'+
       '<button class="btn wide" data-a="backup" style="margin-bottom:8px">'+esc(handOutWord())+'</button>'+
       '<button class="btn sec wide" data-a="restore">Restore from a backup file</button>'+
       '<input id="mfile" type="file" accept=".fibackup,application/json,.json,.txt" class="hide">'+
       '<div class="err" id="mrestoreerr"></div>'+
       '<p class="note">Restoring replaces what is on this phone with what is in the file.</p></div>';

  s += '<h3>What this app does not do</h3>';
  s += '<div class="card"><p class="note big" style="margin-top:0">'+
       'It holds only what you write. It cannot see your bank, and cash it was never told about is invisible to it. '+
       'Recorded money out is rarely everything that went out.<br><br>'+
       'It gives no advice and names no place to put money. Every figure is arithmetic over your own entries.<br><br>'+
       'Nothing leaves this phone. There is no account, no sync and no server, so nobody can open your record for you '+
       'and nobody can recover it if the word or phrase and the recovery key are both lost.</p></div>';

  s += '<div class="card tight"><p class="note" style="margin:0">Free Indeed v'+esc(APP_VERSION)+
       ' · SpiritWrought Ltd<br>Every figure here is in '+esc(CUR)+'.<br>'+
       (standalone() ? 'Running as an app.' :
        'Running in a browser. Add it to your home screen and open it from there.')+
       '</p></div>';
  s += '<button class="btn sec wide" data-a="lock">Lock the app</button>';
  return s;
}

/* ============================================================
   SHEETS — small panels that slide up. The standing door is not one of these.
   ============================================================ */
function sheet(html){
  $("modal").innerHTML = '<div class="modal"><div class="sheet">'+html+'</div></div>';
  var f = $("modal").querySelector("input,textarea");
  if(f) setTimeout(function(){ try{ f.focus(); }catch(e){} }, 60);
}
function closeSheet(){ $("modal").innerHTML = ""; }

function writerSheet(title, note, text, saveLabel, onSave, extra){
  sheet('<h3>'+esc(title)+'</h3>'+
    (note ? '<p class="note big" style="margin-top:0">'+esc(note)+'</p>' : '')+
    '<textarea id="wText">'+esc(text||"")+'</textarea>'+
    (extra || '')+
    '<div class="row" style="margin-top:12px">'+
      '<button class="btn" id="wSave">'+esc(saveLabel||"Keep it")+'</button>'+
      '<button class="btn sec" data-a="close">Close</button>'+
    '</div>');
  $("wSave").onclick = function(){
    var t = $("wText").value;
    if(!String(t).trim()){ closeSheet(); return; }
    onSave(t);
  };
}

var CYCLE_OPTS = '<option value="daily">daily</option><option value="weekly">weekly</option>'+
                 '<option value="monthly">monthly</option><option value="yearly">yearly</option>';

function estSheet(key, item){
  var P = null;
  for(var i=0;i<SETUP_PARTS.length;i++) if(SETUP_PARTS[i].key===key) P = SETUP_PARTS[i];
  var c = item ? cur(item) : null;
  sheet('<h3>'+esc(P.title)+'</h3>'+
    '<label class="f">What it is</label>'+
    '<input id="eName" type="text" value="'+esc(item?item.name:"")+'">'+
    '<div class="two">'+
      '<div><label class="f">Estimate</label>'+
        '<input id="eAmt" type="number" inputmode="decimal" step="0.01" value="'+(c?c.amount:"")+'"></div>'+
      '<div><label class="f">Cycle</label><select id="eCyc">'+CYCLE_OPTS+'</select></div>'+
    '</div>'+
    (key==="costs"
      ? '<label class="f">Which tier</label><select id="eTier">'+
        '<option value="basic">Basic needs — rent, food, transport, data</option>'+
        '<option value="above">Above basic — everything else</option></select>' : '')+
    '<div class="row" style="margin-top:14px">'+
      '<button class="btn" id="eSave">Keep it</button>'+
      '<button class="btn sec" data-a="close">Close</button>'+
      (item ? '<button class="btn sec" id="eDel" style="margin-left:auto">Remove</button>' : '')+
    '</div>'+
    '<div class="err" id="eErr"></div>');
  if(c) $("eCyc").value = c.cycle;
  if(key==="costs" && item) $("eTier").value = item.tier === "above" ? "above" : "basic";
  $("eSave").onclick = function(){
    var nm = $("eName").value.trim(), am = $("eAmt").value, cy = $("eCyc").value;
    if(!nm){ $("eErr").textContent = "Give it a name."; return; }
    if(am === "" || isNaN(+am)){ $("eErr").textContent = "Give it an estimate."; return; }
    if(item){
      item.name = nm;
      if(key==="costs") item.tier = $("eTier").value;
      setItem(item, am, cy);
    } else {
      S[key].push(mkItem(nm, am, cy, key==="costs" ? $("eTier").value : null));
    }
    save(); closeSheet(); paint();
  };
  if(item) $("eDel").onclick = function(){
    var L = S[key];
    for(var i=0;i<L.length;i++) if(L[i].id===item.id){ L.splice(i,1); break; }
    save(); closeSheet(); paint();
  };
}

function entrySheet(x){
  sheet('<h3>Entry</h3>'+
    (x.unreadable ? '<p class="note big" style="margin-top:0"><span class="tag warn">Cannot be read</span><br>'+
        esc(x.raw||"")+'</p>' : '')+
    '<label class="f">How much</label>'+
    '<input id="xAmt" type="number" inputmode="decimal" step="0.01" value="'+(x.amount||"")+'">'+
    '<label class="f">For what</label>'+
    '<input id="xWhat" type="text" value="'+esc(x.what||"")+'">'+
    '<label class="f">Which way</label>'+
    '<select id="xDir"><option value="out">Money out</option><option value="in">Money in</option></select>'+
    '<label class="f">Date</label>'+
    '<input id="xDate" type="date" value="'+esc(x.date||"")+'">'+
    '<label class="row" style="margin-top:12px;font-size:14px">'+
      '<input id="xGive" type="checkbox" style="width:auto;margin-right:8px"'+(x.giving?" checked":"")+'>'+
      'This was giving — held out of the living costs reading and never measured</label>'+
    '<div class="row" style="margin-top:14px">'+
      '<button class="btn" id="xSave">Keep it</button>'+
      '<button class="btn sec" data-a="close">Close</button>'+
      '<button class="btn sec" id="xDel" style="margin-left:auto">Delete</button>'+
    '</div>'+
    '<div class="err" id="xErr"></div>');
  $("xDir").value = x.dir === "in" ? "in" : "out";
  $("xSave").onclick = function(){
    var am = $("xAmt").value;
    if(am === "" || isNaN(+am)){ $("xErr").textContent = "Give it a figure."; return; }
    x.amount = Math.abs(+am);
    x.what = $("xWhat").value.trim();
    x.dir = $("xDir").value;
    x.date = $("xDate").value || null;
    x.giving = $("xGive").checked;
    if(x.amount > 0) x.unreadable = false;
    save(); closeSheet(); paint();
  };
  $("xDel").onclick = function(){
    for(var i=0;i<S.entries.length;i++) if(S.entries[i].id===x.id){ S.entries.splice(i,1); break; }
    save(); closeSheet(); paint();
  };
}

function itemSheet(room, item){
  sheet('<h3>'+(item?"Item":"Add an item")+'</h3>'+
    '<p class="note big" style="margin-top:0">Items that come in multiples and run out. '+
    'Everything else is only an expense.</p>'+
    '<label class="f">What it is</label>'+
    '<input id="iName" type="text" value="'+esc(item?item.name:"")+'">'+
    '<div class="two">'+
      '<div><label class="f">In use</label><input id="iUse" type="number" inputmode="numeric" min="0" step="1" value="'+(item?item.inUse:1)+'"></div>'+
      '<div><label class="f">Reserve</label><input id="iRes" type="number" inputmode="numeric" min="0" step="1" value="'+(item?item.reserve:1)+'"></div>'+
    '</div>'+
    '<div class="row" style="margin-top:14px">'+
      '<button class="btn" id="iSave">Keep it</button>'+
      '<button class="btn sec" data-a="close">Close</button>'+
      (item ? '<button class="btn sec" id="iDel" style="margin-left:auto">Remove</button>' : '')+
    '</div>'+
    '<div class="err" id="iErr"></div>');
  $("iSave").onclick = function(){
    var nm = $("iName").value.trim();
    if(!nm){ $("iErr").textContent = "Give it a name."; return; }
    var u = Math.max(0, Math.round(+$("iUse").value||0));
    var r = Math.max(0, Math.round(+$("iRes").value||0));
    if(item){ item.name = nm; item.inUse = u; item.reserve = r; }
    else room.items.push({ id:uid(), name:nm, inUse:u, reserve:r, takes:[] });
    save(); closeSheet(); paint();
  };
  if(item) $("iDel").onclick = function(){
    for(var i=0;i<room.items.length;i++) if(room.items[i].id===item.id){ room.items.splice(i,1); break; }
    for(var p=S.pending.length-1;p>=0;p--) if(S.pending[p].itemId===item.id) S.pending.splice(p,1);
    save(); closeSheet(); paint();
  };
}

function nameSheet(title, value, onSave, onRemove){
  sheet('<h3>'+esc(title)+'</h3>'+
    '<input id="nName" type="text" value="'+esc(value||"")+'">'+
    '<div class="row" style="margin-top:14px">'+
      '<button class="btn" id="nSave">Keep it</button>'+
      '<button class="btn sec" data-a="close">Close</button>'+
      (onRemove ? '<button class="btn sec" id="nDel" style="margin-left:auto">Remove</button>' : '')+
    '</div>');
  $("nSave").onclick = function(){
    var t = $("nName").value.trim(); if(!t) return;
    onSave(t); save(); closeSheet(); paint();
  };
  if(onRemove) $("nDel").onclick = function(){ onRemove(); save(); closeSheet(); paint(); };
}

/* the closing prompt — the Later line says plainly that the exit costs nothing */
function closeThreadSheet(th){
  sheet('<h3>Want to write how GOD showed up?</h3>'+
    '<div class="row" style="margin-top:6px">'+
      '<button class="btn" id="tNow">Write it now</button></div>'+
    '<div class="row" style="margin-top:8px">'+
      '<button class="btn sec wide" id="tLater">Later — this stays open, and you can come back any time</button></div>');
  $("tNow").onclick = function(){
    writerSheet("How GOD showed up", "", "", "Keep it", function(t){
      th.entries.push({ id:uid(), date:todayISO(), text:t });
      th.open = false; th.closed = todayISO();
      save(); closeSheet(); paint();
    });
  };
  $("tLater").onclick = function(){
    th.open = false; th.closed = todayISO();
    save(); closeSheet(); paint();
  };
}

/* ============================================================
   BACKUP — the whole record, still locked, handed out as one file
   ============================================================ */
async function doBackup(){
  await save();
  var v = vault();
  if(!v){ return; }
  var name = "FreeIndeed-backup-" + todayISO() + ".fibackup";
  var r = await handOut(name, JSON.stringify(v), "application/json");
  var e = $("mrestoreerr");
  if(e){
    if(r === "shared") e.textContent = "Backup sent.";
    else if(r === "saved") e.textContent = "Backup saved as " + name + ".";
    else if(r === "cancelled") e.textContent = "Nothing was sent.";
    else e.textContent = "The file did not save.";
  }
}

/* ============================================================
   EVERY TAP
   ============================================================ */
function findTh(id){ for(var i=0;i<S.threads.length;i++) if(S.threads[i].id===id) return S.threads[i]; return null; }
function findEntry(id){ for(var i=0;i<S.entries.length;i++) if(S.entries[i].id===id) return S.entries[i]; return null; }
function findEst(key,id){ var L=S[key]; for(var i=0;i<L.length;i++) if(L[i].id===id) return L[i]; return null; }

function onTap(ev){
  var t = ev.target.closest ? ev.target.closest("[data-a]") : null;
  if(!t) return;
  var a = t.getAttribute("data-a"), v = t.getAttribute("data-v");

  if(a === "close"){ closeSheet(); return; }
  if(a === "tab"){ closeSheet(); go(v); return; }
  if(a === "unit"){ S.unit = v; save(); paint(); return; }
  if(a === "lock"){ location.reload(); return; }

  if(a === "faith"){
    S.faith = !S.faith;
    if(!S.faith && scr === "god") scr = "more";
    save(); paint(); return;
  }

  if(a === "vision"){
    var lv = latest(S.visions);
    writerSheet("The vision", "What financial freedom means to you, in your own words.",
      "", "Keep it", function(txt){
        S.visions.push({ id:uid(), date:todayISO(), text:txt });
        save(); closeSheet(); paint();
      });
    if(lv) $("wText").value = lv.text;
    return;
  }
  if(a === "legacy"){
    var ll = latest(S.legacies);
    writerSheet("The legacy", "What you want your freedom to make possible.",
      "", "Keep it", function(txt){
        S.legacies.push({ id:uid(), date:todayISO(), text:txt });
        save(); closeSheet(); paint();
      });
    if(ll) $("wText").value = ll.text;
    return;
  }

  if(a === "addEntry"){
    var am = $("lAmt").value, er = $("lErr");
    if(am === "" || isNaN(+am)){ er.textContent = "How much?"; return; }
    S.entries.push({ id:uid(), n:Date.now(), date: $("lDate").value || null,
      dir: v, amount: Math.abs(+am), what: $("lWhat").value.trim(),
      giving:false, unreadable:false, raw:"", pasted:false });
    save(); paint(); return;
  }
  if(a === "edEntry"){ var x = findEntry(t.getAttribute("data-i")); if(x) entrySheet(x); return; }
  if(a === "doPaste"){ doPaste(); return; }

  if(a === "addEst"){ estSheet(t.getAttribute("data-k"), null); return; }
  if(a === "edEst"){
    var k = t.getAttribute("data-k");
    var it = findEst(k, t.getAttribute("data-i"));
    if(it) estSheet(k, it);
    return;
  }

  if(a === "addRoom"){
    nameSheet("Add a room", "", function(nm){ S.rooms.push({ id:uid(), name:nm, items:[] }); });
    return;
  }
  if(a === "renRoom"){
    var R1 = roomOf(t.getAttribute("data-r")); if(!R1) return;
    nameSheet("Room name", R1.name, function(nm){ R1.name = nm; });
    return;
  }
  if(a === "delRoom"){
    var R2 = roomOf(t.getAttribute("data-r")); if(!R2) return;
    nameSheet("Remove " + R2.name + "?", R2.name,
      function(nm){ R2.name = nm; },
      function(){
        for(var i=0;i<S.rooms.length;i++) if(S.rooms[i].id===R2.id){ S.rooms.splice(i,1); break; }
        for(var p=S.pending.length-1;p>=0;p--) if(S.pending[p].roomId===R2.id) S.pending.splice(p,1);
      });
    return;
  }
  if(a === "addItem"){ var R3 = roomOf(t.getAttribute("data-r")); if(R3) itemSheet(R3, null); return; }
  if(a === "edItem"){
    var R4 = roomOf(t.getAttribute("data-r")); if(!R4) return;
    var I4 = itemOf(R4, t.getAttribute("data-i")); if(I4) itemSheet(R4, I4);
    return;
  }
  if(a === "take"){ takeItem(t.getAttribute("data-r"), t.getAttribute("data-i")); return; }
  if(a === "fillPend"){
    var pid = t.getAttribute("data-p");
    for(var q=0;q<S.pending.length;q++){
      if(S.pending[q].id === pid){
        var rr = roomOf(S.pending[q].roomId);
        if(rr){ var ii = itemOf(rr, S.pending[q].itemId); if(ii) ii.reserve += 1; }
        S.pending.splice(q,1); break;
      }
    }
    save(); paint(); return;
  }
  if(a === "delPend"){
    var pid2 = t.getAttribute("data-p");
    for(var q2=0;q2<S.pending.length;q2++) if(S.pending[q2].id===pid2){ S.pending.splice(q2,1); break; }
    save(); paint(); return;
  }

  if(a === "newLetter"){
    writerSheet("Write to GOD", "Dated, standing on its own. Nothing is required of it.",
      "", "Keep it", function(txt){
        S.letters.push({ id:uid(), date:todayISO(), text:txt });
        save(); closeSheet(); if(scr !== "god") go("god"); else paint();
      });
    return;
  }
  if(a === "edLetter"){
    var lid = t.getAttribute("data-i"), L = null;
    for(var li=0;li<S.letters.length;li++) if(S.letters[li].id===lid) L = S.letters[li];
    if(!L) return;
    writerSheet("Letter · " + niceDate(L.date), "", L.text, "Keep it", function(txt){
      L.text = txt; save(); closeSheet(); paint();
    });
    return;
  }

  if(a === "newThread"){
    nameSheet("What are you in?", "", function(title){
      S.threads.push({ id:uid(), title:title, open:true, closed:null,
        entries:[{ id:uid(), date:todayISO(), text:title }] });
    });
    return;
  }
  if(a === "addThEntry"){
    var th1 = findTh(t.getAttribute("data-i")); if(!th1) return;
    writerSheet("Add to “" + th1.title + "”", "", "", "Keep it", function(txt){
      th1.entries.push({ id:uid(), date:todayISO(), text:txt });
      save(); closeSheet(); paint();
    });
    return;
  }
  if(a === "edThEntry"){
    var th2 = findTh(t.getAttribute("data-i")); if(!th2) return;
    var eid = t.getAttribute("data-e"), EN = null;
    for(var ei=0;ei<th2.entries.length;ei++) if(th2.entries[ei].id===eid) EN = th2.entries[ei];
    if(!EN) return;
    writerSheet(niceDate(EN.date), "A closed thread stays open to writing forever.", EN.text, "Keep it",
      function(txt){ EN.text = txt; save(); closeSheet(); paint(); });
    return;
  }
  if(a === "closeTh"){ var th3 = findTh(t.getAttribute("data-i")); if(th3) closeThreadSheet(th3); return; }
  if(a === "openTh"){
    var th4 = findTh(t.getAttribute("data-i"));
    if(th4){ th4.open = true; th4.closed = null; save(); paint(); }
    return;
  }

  if(a === "backup"){ doBackup(); return; }
  if(a === "restore"){ $("mfile").click(); return; }
}

      save(); closeSheet(); paint();

});

    var f = ev.target.files && ev.target.files[0];
    if(f) readBackupFile(f);
  }
});

(function boot(){
  if(!window.crypto || !window.crypto.subtle || !crypto.subtle.deriveKey){ noCrypto(); return; }
  if(!window.isSecureContext){ noCrypto(); return; }
  var v = vault();
  if(!v || !v.pin) gateSetPin(); else gateUnlock();
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js", { scope:"./" }).catch(function(){});
    });
  }
})();
